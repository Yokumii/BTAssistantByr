tracker:
  base_url: "https://byr.pt"
  proxy_url: ""
  username: ""
  password: ""
  cookie: ""

client:
  base_url: "http://127.0.0.1:8080"
  username: ""
  password: ""
  save_path: ""

strategy:
  max_disk_usage_gib: 500
  # max_torrent_size_gib: 100
  min_free_space_gib: 10
  refresh_interval: "121s"

execution:
  mode: "request_approval"

runtime:
  data_dir: "data"
  log_dir: "logs"
  log_level: "info"
  log_color: "auto"

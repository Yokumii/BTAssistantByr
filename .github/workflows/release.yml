name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Verify and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=readonly
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify release tag
        id: release
        run: ./scripts/release-metadata.sh "${RELEASE_TAG}"

      - name: Verify tag branch
        env:
          TARGET_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" "refs/remotes/origin/${TARGET_BRANCH}"; then
            echo "Tag commit ${RELEASE_COMMIT} is not contained in ${TARGET_BRANCH}." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "stable"
          cache-dependency-path: go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Run release checks
        run: make ci

      - name: Build release archives
        run: ./scripts/build-release.sh "${RELEASE_TAG}" dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BTAssistantByr-${{ env.RELEASE_TAG }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  attest:
    name: Attest release artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BTAssistantByr-${{ env.RELEASE_TAG }}-release
          path: dist

      - name: Generate artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/BTAssistantByr_*.tar.gz
            dist/BTAssistantByr_*.zip
            dist/SHA256SUMS

  release:
    name: Create or update draft release
    needs:
      - build
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BTAssistantByr-${{ env.RELEASE_TAG }}-release
          path: dist

      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Refuse changes to published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -f tag="${RELEASE_TAG}" \
            -f query='query($owner: String!, $name: String!, $tag: String!) {
              repository(owner: $owner, name: $name) {
                release(tagName: $tag) { isDraft }
              }
            }' \
            --jq '.data.repository.release | if . == null or .isDraft == true then "Draft release update allowed" else error("Refusing to replace a published release") end'

      - name: Create or update draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/BTAssistantByr_*.tar.gz
            dist/BTAssistantByr_*.zip
            dist/SHA256SUMS

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Classify release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release-metadata.sh "${RELEASE_TAG}"

      - name: Verify tag branch
        env:
          TARGET_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" "refs/remotes/origin/${TARGET_BRANCH}"; then
            echo "Tag commit ${RELEASE_COMMIT} is not contained in ${TARGET_BRANCH}." >&2
            exit 1
          fi

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Run release checks
        run: make ci

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.sh "${RELEASE_TAG}" dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          arguments=(
            "${RELEASE_TAG}"
            dist/*
            --verify-tag
            --generate-notes
            --title "${RELEASE_TAG}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"

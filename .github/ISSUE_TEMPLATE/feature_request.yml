name: 功能建议
description: 建议新的能力或现有行为改进
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先搜索已有 Issue，避免重复提议。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，未发现相同建议。
          required: true
        - label: 这个建议与 BTAssistantByr 的职责直接相关。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 请描述实际使用场景、当前遇到的限制，以及受影响的用户。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望的行为、配置或交互方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 请说明目前如何绕过问题，以及其他可选方案为何不合适。

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可提供示例配置、流程说明、相关链接或其他背景信息。
